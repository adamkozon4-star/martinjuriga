  <div class="intro" aria-hidden="true">
    <div class="intro__inner">
      <svg class="intro__mark" viewBox="0 0 560 336">
        <defs>
          <linearGradient id="introGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c9803f"/><stop offset=".55" stop-color="#e09a5b"/><stop offset="1" stop-color="#f3c08a"/></linearGradient>
        </defs>
        <path class="intro__trace" d="M40 240L200 92 308 210 512 40V236c0 30-22 52-52 52h-44" />
        <path class="intro__path" d="M40 240L200 92 308 210 512 40V236c0 30-22 52-52 52h-44" />

      </svg>
      <div class="intro__name"><span>Martin Juriga</span></div>

      <div class="intro__bar"><i></i></div>
    </div>
  </div>
  <script>
    (function () {
      var d = document.documentElement, seen = false;
      try { seen = sessionStorage.getItem('intro') === '1'; sessionStorage.setItem('intro', '1'); } catch (e) {}
      if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches) { d.classList.add('no-intro'); return; }
      d.classList.add('intro-on');
      setTimeout(function () { d.classList.add('intro-out'); }, 1900);
      setTimeout(function () { d.classList.remove('intro-on'); d.classList.add('no-intro'); }, 2700);
    })();
  </script>
