  <!-- úvodná animácia: logo sa vykreslí zľava doprava, raz za návštevu -->
  <div class="intro" aria-hidden="true">
    <div class="intro__inner">
      <img class="intro__mark" src="/img/logo-mj-big.webp" width="1068" height="560" alt="" />
      <div class="intro__name"><span>Martin Juriga</span></div>
      <div class="intro__tag"><span>Finančné plánovanie</span></div>
      <div class="intro__bar"><i></i></div>
    </div>
  </div>
  <script>
    // stránka sa vždy otvorí hore: prehliadač si nepamätá starú pozíciu a pri obnovení zahodí #kotvu v adrese
    (function () {
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        var reload = nav ? nav.type === 'reload' || nav.type === 'back_forward' : false;
        if (location.hash && reload) history.replaceState(null, '', location.pathname + location.search);
        if (!location.hash) window.scrollTo(0, 0);
        addEventListener('load', function () { if (!location.hash) window.scrollTo(0, 0); });
      } catch (e) {}
    })();
    (function () {
      var d = document.documentElement, seen = false;
      try { seen = sessionStorage.getItem('intro') === '1'; sessionStorage.setItem('intro', '1'); } catch (e) {}
      if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches) { d.classList.add('no-intro'); return; }
      d.classList.add('intro-on');
      setTimeout(function () { d.classList.add('intro-out'); }, 1900);
      setTimeout(function () { d.classList.remove('intro-on'); d.classList.add('no-intro'); }, 2700);
    })();
  </script>
